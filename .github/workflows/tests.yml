name: Testai

# Paleidziama, kai ikeli nauja koda ar konfiguracija. Raudonas X GitHub'e = kazkas sulauzyta;
# gyvas siuntejas (check.yml) vis tiek dirba su tuo, kas ikelta, tad testus verta paziureti
# PRIES keiciant gyva main. Testu rinkinys – tas pats kaip W1ther2/Testeris_vinted (staging).
on:
  push:
    paths:
      - "vinted/**"
      - "tests/**"
      - "vinted_deal_finder.py"
      - "requirements.txt"
      - "config.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Testai
        run: python -m unittest discover -s tests -t .
