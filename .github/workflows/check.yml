name: Vinted deal finder

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: vinted-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # Push paleidimas skirtas tik naujos versijos release'ui.
    # Busenos commitai neturi paleisti boto is naujo.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'RELEASE v49.1-free')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Paleisti v49.1
        env:
          BOT_TOKEN: ${{ secrets.BOT }}
          CHAT_ID: ${{ secrets.TEL }}
          CHAT_TOPIC_ID: ${{ secrets.TOPIC_IPHONE }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT }}
        run: python vinted_deal_finder.py

      - name: Issaugoti busena
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          [ -f seen.json ] && git add seen.json || true
          [ -f state.json ] && git add state.json || true
          [ -d archive ] && git add archive || true
          git diff --cached --quiet || git commit -m "Atnaujinta busena"
          git pull --rebase --autostash || true
          git push || true
